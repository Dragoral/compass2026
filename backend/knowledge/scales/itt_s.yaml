code: ITT_S
title: ИТТ — ситуативная тревожность (ежедневный мониторинг)
respondent: patient
period: Насколько данное состояние выражено именно СЕЙЧАС, В ДАННЫЙ МОМЕНТ, СЕГОДНЯ?
license: Использование в клинической практике по методике интегративного теста тревожности (ИТТ)
validation:
  - "Интегративный тест тревожности (ИТТ). Ситуативная шкала (СТ) для ежедневного самоотчёта."
  - "Интерпретация по станайнам: 1–3 — низкая тревога, 4–6 — средняя, 7–9 — клинически значимо повышенная."
  - "Таблица станайнов в методике различается для взрослых/юношей и девушек; в системе используются градации по сырому баллу с клиническим порогом ≥19 (станайны 7–9 для взрослых и юношей)."
verified: false
options: &opts
  - { value: 0, label: Совсем нет }
  - { value: 1, label: Слабо выражено }
  - { value: 2, label: Выражено }
  - { value: 3, label: Очень выражено }
items:
  - { n: 1,  text: "Я нахожусь в напряжении", options: *opts }
  - { n: 2,  text: "Я расстроен", options: *opts }
  - { n: 3,  text: "Я тревожусь о будущем", options: *opts }
  - { n: 4,  text: "Я нервничаю", options: *opts }
  - { n: 5,  text: "Я озабочен", options: *opts }
  - { n: 6,  text: "Я возбужден", options: *opts }
  - { n: 7,  text: "Я ощущаю непонятную угрозу", options: *opts }
  - { n: 8,  text: "Я устаю быстрее обычного", options: *opts }
  - { n: 9,  text: "Я не уверен в себе", options: *opts }
  - { n: 10, text: "Я избегаю любых конфликтов", options: *opts }
  - { n: 11, text: "Я чувствую замешательство", options: *opts }
  - { n: 12, text: "Я ощущаю свою бесполезность", options: *opts }
  - { n: 13, text: "Я спал беспокойно", options: *opts }
  - { n: 14, text: "Я ощущаю себя утомленным", options: *opts }
  - { n: 15, text: "Я эмоционально чувствителен", options: *opts }
scoring: { method: sum }
# Сырой балл 0–45. Ориентиры по станайнам (взрослые/юноши): 1–3 ≤9, 4–6 ≈10–18, 7–9 ≥19
bands:
  - { min: 0,  max: 9,  label: Низкая тревога, severity: 0 }
  - { min: 10, max: 18, label: Средняя тревога, severity: 1 }
  - { min: 19, max: 26, label: Повышенная (клинически значимая), severity: 2 }
  - { min: 27, max: 45, label: Высокая (клинически значимая), severity: 3 }
mcid: 4
